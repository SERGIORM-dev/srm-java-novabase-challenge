spring.application.name=novabase-challenge

# Datasource - H2 in-memory, named (not random) for consistency across runs
spring.datasource.url=jdbc:h2:mem:novabase;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Ensure data.sql runs AFTER Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Force UTF-8 on HTTP responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT
# PRODUCTION NOTE: this must come from an environment variable / secret manager
# (e.g. ${JWT_SECRET}) in a real deployment, never committed as plain text.
security.jwt.secret=dev-only-secret-please-replace-32-bytes-minimum-1234567890
security.jwt.expiration-minutes=60

# Rate limiting
security.rate-limit.login.limit=5
security.rate-limit.login.refill-minutes=1
security.rate-limit.api.limit=60
security.rate-limit.api.refill-minutes=1
