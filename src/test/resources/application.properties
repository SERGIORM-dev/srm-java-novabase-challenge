spring.sql.init.mode=never

# JWT test config (test resources shadow main application.properties entirely,
# so these must be repeated here for the full application context to load).
security.jwt.secret=test-only-secret-please-replace-32-bytes-minimum-1234567890
security.jwt.expiration-minutes=60

# Rate-limit test config (same shadowing caveat).
security.rate-limit.login.limit=5
security.rate-limit.login.refill-minutes=1
security.rate-limit.api.limit=60
security.rate-limit.api.refill-minutes=1
